# Render Blueprint: New > Blueprint > pick this repo. See README "部署到 Render".
services:
  - type: web
    name: plategap
    runtime: docker
    plan: standard            # 2 GB RAM: model training peaks at ~1.4 GB. 512 MB plans are too small.
    healthCheckPath: /api/health
    disk:
      name: plategap-data
      mountPath: /var/plategap
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /var/plategap/data
      - key: OUTPUT_DIR
        value: /var/plategap/output
      - key: ADMIN_TOKEN
        generateValue: true   # copy it from the Render dashboard for the API calls in the README
      - key: DEEPSEEK_API_KEY
        sync: false           # paste your DeepSeek key in the dashboard (plain-English report writer)
